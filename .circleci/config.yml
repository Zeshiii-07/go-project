version: 2.1

jobs:
  deploy-nginx:
    machine: true
    resource_class: hashx/deployment
    steps:
      - checkout

      - run:
          name: Check Podman
          command: |
            podman --version

      - run:
          name: Stop existing Nginx
          command: |
            podman stop nginx || true
            podman rm nginx || true

      - run:
          name: Deploy Nginx
          command: |
            podman pull docker.io/library/nginx:latest
            podman run -d \
              --name nginx \
              -p 8080:80 \
              docker.io/library/nginx:latest

      - run:
          name: Verify Nginx
          command: |
            podman ps
            curl -I http://localhost:8080

workflows:
  deploy:
    jobs:
      - deploy-nginx
